[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/alexderz/llama-bored"

[workspace.dependencies]
nusb = "=0.2.7"
rustix = { version = "=1.1.5", features = ["event", "fs", "process", "rand", "termios", "time"] }
tiny-skia = "=0.12.0"
fontdue = "=0.9.4"
png = "=0.18.1"
nvml-wrapper = "=0.13.0"
ureq = { version = "=3.4.2", default-features = false }
serde_json = "=1.0.151"
toml = "=1.1.6"
serde = { version = "=1.0.229", features = ["derive"] }
sd-notify = "=0.5.0"
thiserror = "=2.0.20"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
