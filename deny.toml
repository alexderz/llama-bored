[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is a transitive dependency of LLD-pinned fontdue 0.9.4; no safe upgrade exists; unmaintained (informational, no vuln); ttf-parser only parses our bundled fonts; revisit if fontdue moves off ttf-parser or a vulnerability is filed — tracked in docs/lld.md Open" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = [
    "libusb1-sys",
    "hidapi",
    "openssl-sys",
    # Direct dependents must be llama-watch. The writer's tree is also
    # checked by scripts/s10-deps.sh.
    { crate = "ureq", wrappers = ["llama-watch"] },
    { crate = "nvml-wrapper", wrappers = ["llama-watch"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
