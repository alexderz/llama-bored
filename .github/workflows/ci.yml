# The whole gate is scripts/check.sh: fmt, clippy, tests, cargo-deny,
# cargo-audit, the S-fence scans and the installer/unit self-tests. No
# hardware is needed; device tests use fakes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup on the runner installs the toolchain rust-toolchain.toml pins.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny,cargo-audit
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acl
      - name: check.sh
        run: scripts/check.sh
