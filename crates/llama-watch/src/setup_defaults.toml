# Built-in SETUP rules (#52): upstream llama.cpp, vLLM and SGLang flags,
# the settings Strata reports in its /metrics (#54, `engine:<key>`), and
# tqLLM's flags with what its snapshot and /health report (#180).
#
# The same format as `[[setup.field]]` in watch.toml (README "SETUP rules").
# watch.toml rules extend these; `[setup] defaults = false` drops them.
# Orders: engine 10, ctx 20, experts 30, spec 40, think 50, serve 60,
# sample 70. A watch.toml field with no order sorts after all of these.

# ---- engine: the server, the weights' quant, flash attention ------------

[[field]]
row = "engine"
source = "live:engine"
order = 10

[[field]]
row = "engine"
engines = ["llamacpp"]
source = "flag:-m,--model"
kind = "quant"
order = 11

[[field]]
row = "engine"
engines = ["vllm", "sglang"]
source = "flag:--quantization"
kind = "token"
order = 11

# Strata: its version, and the quant from the llama-swap model name (its
# command names only a config file).
[[field]]
row = "engine"
engines = ["strata"]
source = "engine:version"
sep = " "
order = 10

[[field]]
row = "engine"
engines = ["strata"]
source = "name"
kind = "quant"
order = 11

# tqLLM: its build, from the snapshot's `engine.build`.
[[field]]
row = "engine"
engines = ["tqllm"]
source = "engine:version"
sep = " "
order = 10

[[field]]
row = "engine"
engines = ["llamacpp"]
source = "flag:-fa,--flash-attn"
kind = "token"
map = { on = "fa on", off = "fa off", auto = "fa auto", "1" = "fa on", "0" = "fa off" }
order = 12

# ---- ctx: context size and the KV cache ---------------------------------

[[field]]
row = "ctx"
engines = ["llamacpp"]
source = "flag:-c,--ctx-size"
kind = "number"
order = 20

[[field]]
row = "ctx"
engines = ["vllm"]
source = "flag:--max-model-len"
kind = "number"
order = 20

[[field]]
row = "ctx"
engines = ["sglang"]
source = "flag:--context-length"
kind = "number"
order = 20

# What the engine itself reports (Strata's max_context), when no flag said.
[[field]]
row = "ctx"
source = "live:ctx"
fallback = true
order = 21

[[field]]
row = "ctx"
engines = ["llamacpp"]
source = "flag:-ctk,--cache-type-k"
kind = "token"
label = "kv"
default = "kv f16"
order = 22

[[field]]
row = "ctx"
engines = ["llamacpp"]
source = "flag:-ctv,--cache-type-v"
kind = "token"
sep = " / "
default = "f16"
order = 23

# vLLM's cache_config_info dtype (or --kv-cache-dtype), SGLang's flag,
# Strata's engine.kv.
[[field]]
row = "ctx"
engines = ["vllm", "sglang", "strata"]
source = "live:kv_dtype"
label = "kv"
order = 22

# tqLLM: the KV its command asked for with --kv or -ctk / -ctv (`--` when
# a value is not a token); with none of them its default, dim, since the
# memory fit may pick a smaller one (#180).
[[field]]
row = "ctx"
engines = ["tqllm"]
source = "engine:kv_asked"
kind = "text"
max_chars = 33
label = "kv"
default = "kv bf16"
order = 22

# Strata: KV tokens kept resident on the GPU.
[[field]]
row = "ctx"
engines = ["strata"]
source = "engine:kv_resident"
kind = "number"
label = "resident"
order = 23

[[field]]
row = "ctx"
engines = ["vllm"]
source = "live:kv_block"
label = "block"
order = 24

[[field]]
row = "ctx"
engines = ["vllm"]
source = "live:prefix_cache"
map = { on = "prefix on", off = "prefix off" }
group = "prefix"
order = 25

# tqLLM: what its memory fit chose, from /health (empty when it kept what
# was asked, and then the row is not drawn).
[[field]]
row = "fit"
engines = ["tqllm"]
source = "engine:fit"
kind = "text"
max_chars = 96
order = 26

# ---- experts: MoE layers kept in system RAM ------------------------------

[[field]]
row = "experts"
engines = ["llamacpp"]
source = "flag:-cmoe,--cpu-moe"
kind = "present"
map = { on = "all layers in RAM" }
order = 30

[[field]]
row = "experts"
engines = ["llamacpp"]
source = "flag:-ncmoe,--n-cpu-moe"
kind = "number"
suffix = " layers in RAM"
map = { "0" = "full GPU" }
default = "full GPU"
fallback = true
order = 31

# Strata: its expert cache, size and slots.
[[field]]
row = "experts"
engines = ["strata"]
source = "engine:expert_cache_mib"
kind = "mib"
label = "cache"
order = 30

[[field]]
row = "experts"
engines = ["strata"]
source = "engine:expert_slots"
kind = "number"
suffix = " slots"
order = 31

# tqLLM: the MoE expert memory in system RAM and its cache.
[[field]]
row = "experts"
engines = ["tqllm"]
source = "flag:--moe-host-mb"
kind = "mib"
label = "host"
order = 30

[[field]]
row = "experts"
engines = ["tqllm"]
source = "flag:--moe-cache-mb"
kind = "mib"
label = "cache"
order = 31

# The newest request's expert cache hit rate and PCIe share (any engine
# that reports them; Strata does).
[[field]]
row = "experts"
source = "live:expert_hit"
label = "hit"
order = 32

[[field]]
row = "experts"
source = "live:pcie_share"
label = "pcie"
order = 33

# ---- spec: speculative decoding and its live acceptance ------------------

[[field]]
row = "spec"
engines = ["llamacpp"]
source = "flag:--spec-type"
kind = "token"
order = 40

[[field]]
row = "spec"
engines = ["llamacpp"]
source = "flag:-md,--model-draft"
kind = "present"
map = { on = "draft model" }
fallback = true
order = 41

[[field]]
row = "spec"
engines = ["llamacpp"]
source = "flag:--spec-draft-n-max,--draft-max,--draft-n,--draft"
kind = "number"
label = "n-max"
order = 42

[[field]]
row = "spec"
engines = ["vllm"]
source = "json:--speculative-config:method"
kind = "token"
order = 40

[[field]]
row = "spec"
engines = ["vllm"]
source = "json:--speculative-config:num_speculative_tokens"
kind = "number"
label = "n"
order = 42

[[field]]
row = "spec"
engines = ["sglang"]
source = "flag:--speculative-algorithm"
kind = "token"
order = 40

[[field]]
row = "spec"
engines = ["sglang"]
source = "flag:--speculative-num-draft-tokens"
kind = "number"
label = "n"
order = 42

# Strata: draft depth, MTP and lookup drafts, and the draft min-p.
[[field]]
row = "spec"
engines = ["strata"]
source = "engine:spec"
kind = "number"
label = "depth"
map = { "0" = "off" }
order = 40

[[field]]
row = "spec"
engines = ["strata"]
source = "engine:mtp_max"
kind = "number"
label = "mtp"
order = 41

[[field]]
row = "spec"
engines = ["strata"]
source = "engine:lookup"
kind = "number"
label = "lookup"
order = 42

[[field]]
row = "spec"
engines = ["strata"]
source = "engine:spec_min_p"
kind = "number"
label = "min-p"
order = 43

# tqLLM: the model's own MTP head, or a DFlash2 drafter (-md), and the
# drafted tokens per step.
[[field]]
row = "spec"
engines = ["tqllm"]
source = "flag:--mtp"
kind = "present"
map = { on = "MTP" }
group = "kind"
order = 40

[[field]]
row = "spec"
engines = ["tqllm"]
source = "flag:-md"
kind = "present"
map = { on = "DFlash2" }
group = "kind"
fallback = true
order = 41

[[field]]
row = "spec"
engines = ["tqllm"]
source = "flag:--draft-max"
kind = "number"
label = "n-max"
order = 42

[[field]]
row = "spec"
source = "live:spec_len"
label = "acc"
order = 44

[[field]]
row = "spec"
source = "live:spec_accept"
order = 45

[[field]]
row = "spec"
engines = ["llamacpp", "vllm", "sglang", "tqllm"]
default = "none"
fallback = true
order = 49

# ---- think: reasoning budget and switches --------------------------------

[[field]]
row = "think"
engines = ["llamacpp"]
source = "flag:--reasoning-budget"
kind = "number"
label = "budget"
map = { "-1" = "unlimited", "0" = "off" }
order = 50

[[field]]
row = "think"
engines = ["llamacpp"]
source = "json:--chat-template-kwargs:enable_thinking"
kind = "token"
map = { "true" = "on", "false" = "off" }
order = 51

[[field]]
row = "think"
engines = ["vllm", "sglang"]
source = "flag:--reasoning-parser"
kind = "token"
label = "parser"
order = 52

# tqLLM: --reasoning on|off and its token budget.
[[field]]
row = "think"
engines = ["tqllm"]
source = "flag:--reasoning-budget,--thinking-budget"
kind = "number"
label = "budget"
map = { "-1" = "unlimited", "0" = "off" }
order = 50

[[field]]
row = "think"
engines = ["tqllm"]
source = "flag:--reasoning"
kind = "token"
map = { on = "on", off = "off" }
order = 51

# ---- serve: memory share and batch limits --------------------------------

[[field]]
row = "serve"
engines = ["vllm"]
source = "flag:--gpu-memory-utilization"
kind = "number"
label = "mem"
order = 60

[[field]]
row = "serve"
engines = ["sglang"]
source = "flag:--mem-fraction-static"
kind = "number"
label = "mem"
order = 60

[[field]]
row = "serve"
engines = ["vllm"]
source = "flag:--max-num-seqs"
kind = "number"
label = "seqs"
order = 61

[[field]]
row = "serve"
engines = ["sglang"]
source = "flag:--max-running-requests"
kind = "number"
label = "reqs"
order = 61

[[field]]
row = "serve"
engines = ["vllm"]
source = "flag:--max-num-batched-tokens"
kind = "number"
label = "batch"
order = 62

# Strata: the PCIe fraction, the arena, pool workers and the conversation
# cache (its budget while on, else `conv cache off`).
[[field]]
row = "serve"
engines = ["strata"]
source = "engine:pcie_frac"
kind = "number"
label = "pcie"
order = 60

[[field]]
row = "serve"
engines = ["strata"]
source = "engine:arena_mib"
kind = "mib"
label = "arena"
order = 61

[[field]]
row = "serve"
engines = ["strata"]
source = "engine:pool_workers"
kind = "number"
suffix = " workers"
order = 62

[[field]]
row = "serve"
engines = ["strata"]
source = "engine:conversation_cache_mib"
kind = "mib"
label = "conv cache"
group = "conv"
order = 63

[[field]]
row = "serve"
engines = ["strata"]
source = "engine:conversation_cache"
map = { on = "conv cache on", off = "conv cache off" }
group = "conv"
fallback = true
order = 64

# tqLLM: the requests it serves at once, the snapshot's `engine.slots`
# (the memory fit may lower --np), else --np.
[[field]]
row = "serve"
engines = ["tqllm"]
source = "engine:slots"
kind = "number"
suffix = " slots"
group = "np"
order = 61

[[field]]
row = "serve"
engines = ["tqllm"]
source = "flag:--np"
kind = "number"
suffix = " slots"
group = "np"
fallback = true
order = 62

# ---- sample: sampling overrides ------------------------------------------

[[field]]
row = "sample"
engines = ["llamacpp"]
source = "flag:--temp"
kind = "number"
label = "temp"
order = 70

[[field]]
row = "sample"
engines = ["llamacpp"]
source = "flag:--top-p"
kind = "number"
label = "top-p"
order = 71

[[field]]
row = "sample"
engines = ["llamacpp"]
source = "flag:--top-k"
kind = "number"
label = "top-k"
order = 72

[[field]]
row = "sample"
engines = ["llamacpp"]
source = "flag:--min-p"
kind = "number"
label = "min-p"
order = 73

[[field]]
row = "sample"
engines = ["llamacpp"]
source = "flag:--presence-penalty"
kind = "number"
label = "pres"
order = 74

# tqLLM: the defaults for requests that set none (greedy otherwise).
[[field]]
row = "sample"
engines = ["tqllm"]
source = "flag:--temperature"
kind = "number"
label = "temp"
order = 70

[[field]]
row = "sample"
engines = ["tqllm"]
source = "flag:--top-p"
kind = "number"
label = "top-p"
order = 71

[[field]]
row = "sample"
engines = ["tqllm"]
source = "flag:--top-k"
kind = "number"
label = "top-k"
order = 72
