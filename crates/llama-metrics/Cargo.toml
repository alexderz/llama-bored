[package]
name = "llama-metrics"
version = "0.3.6"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "llama-metrics"
path = "src/main.rs"

[dependencies]
llama-core = { path = "../llama-core" }
rustix = { workspace = true, features = ["event", "fs", "time"] }
sd-notify = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
