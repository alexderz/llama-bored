[package]
name = "kraken-lcd"
version = "0.2.2"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kraken-lcd"
path = "src/main.rs"

[dependencies]
llama-core = { path = "../llama-core" }
fontdue = { workspace = true }
nusb = { workspace = true }
png = { workspace = true }
rustix = { workspace = true, features = ["time"] }
sd-notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
