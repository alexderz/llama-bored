# /etc/llama-bored/cast.toml: llama-cast, tty11 as a live video for TVs.
#
# LAN-exposed by design. It announces a DLNA/UPnP MediaServer over SSDP
# (udp/1900) and serves the tty11 dashboard as MPEG-TS video (1920x1080,
# H.264) to the networks below and to nobody else. Anyone allowed can watch
# what tty11 shows: model names, rates, context use, host load. It carries
# no prompt or output text; the dashboard shows none.
#
# tty mode reads /dev/vcsa11 (read-only). grid mode reads the grid file
# (the llama-view group can already read that directory). It also reads the
# console font below, /etc/machine-id (hashed into the device id) and this
# file. It opens no other device, writes no file, dials nothing, and runs
# only `ffmpeg` (one per viewer).
#
# On the TV (Roku Media Player): Media type Video -> "llama-bored (HOST)" ->
# "tty11 on HOST", HOST being this machine's host name.

# IPv4:PORT for the HTTP server (descriptions, control, the stream).
# 19478 sits next to llama-metrics' 19477. Changing it needs a unit drop-in
# (SocketBindAllow=, see llama-cast.service) and a firewall change.
listen = "0.0.0.0:19478"

# CIDR allowlist, checked for every connection before a byte is read and
# for every SSDP search before it is answered. Host bits must be zero and
# /0 is refused. 1..=32 entries. The shipped value is an example: every
# 192.168.x.x host plus loopback. Narrow it to your LAN or to the TVs, for
# example ["192.168.1.0/24"] or ["192.168.1.40/32", "192.168.1.41/32"].
# Keep this equal to IPAddressAllow= in llama-cast.service (which also
# lists the SSDP group 239.255.255.250/32).
allow = ["192.168.0.0/16", "127.0.0.1/32"]

# This host's LAN address: SSDP joins the multicast group and announces on
# it, and it is the address in every URL the TV is given. Required when
# listen is 0.0.0.0; with a specific listen address it must be that one.
# CHANGE THIS to the address the TVs can reach.
interface_addr = "192.168.1.20"

# The server name the TV lists, and the title of its one video. 1..=64
# printable characters each. {host} is replaced by this machine's host name
# (its first label, letters, digits, - and _ only, at most 32 characters),
# so two servers, or a server and a TV's stale entry for it, are told apart
# in the list (#21). Without {host} the text is used as written. The device
# id the TV keys the entry on is a hash of /etc/machine-id: stable for this
# host, different on another.
name = "llama-bored ({host})"
title = "tty11 on {host}"

# Frames rendered from tty11 per second, 1..=5. ffmpeg repeats them to
# 10 fps; each viewer costs one ffmpeg (roughly a fifth of a core at 2).
fps = 2

# Viewers at once, 1..=4. One more is answered 503.
max_clients = 2

# Constant video bitrate in kbit/s, 500..=20000, or 0 for none. A still
# dashboard encodes to a few kbit/s; a TV that waits for a fixed amount of
# data before it plays (Roku Media Player) then takes tens of seconds to
# start (#20). Only libx264 pads a still screen to this constant bitrate.
# libopenh264 and the hardware encoders do not, so a TV that waits for a
# fixed amount of data starts a still dashboard more slowly with them.
# With libx264 the buffer fills in about a second. 0 is the old
# quality-based stream: least bandwidth, slowest start. Each viewer costs
# this much LAN bandwidth.
bitrate_kbps = 4000

# Seconds between keyframes, 1..=10. Each viewer's stream starts at a
# keyframe anyway; this is how soon a TV recovers from a lost packet.
keyframe_s = 1

# Seconds of picture each new viewer gets at once, 0..=10: the first frame,
# repeated, encoded as fast as ffmpeg can, so the TV's start buffer is full
# before the live frames follow. The picture then runs this far behind
# tty11. 0 sends frames only as they are rendered.
preroll_s = 3

# The encoder program, an absolute path. llama-cast runs it with a fixed
# argument list, no shell and an empty environment. Install it from the
# distribution; it is not part of llama-bored (see THIRD-PARTY.md).
ffmpeg = "/usr/bin/ffmpeg"

# Which H.264 encoder that program is asked for. "auto" (the default, used
# when this line is absent) runs `ffmpeg -encoders` once at start and picks
# libx264, then libopenh264, then a hardware encoder (h264_nvenc, h264_qsv,
# h264_vaapi, h264_amf, h264_v4l2m2m) only when neither software encoder
# exists. Software x264 gives the best text quality at 2 fps, plays
# everywhere, and takes nothing from a GPU busy with inference; hardware
# encoders need a device and are a last resort. The choice is made once,
# at start. After installing or upgrading ffmpeg, restart llama-cast.
# The shipped unit sets
# DevicePolicy=closed and allows only /dev/vcsa11, so a hardware encoder
# usually cannot open its device. Pin one of the names above to require it.
# An unknown name is a config error.
# encoder = "auto"

# Picture source: "tty" (default, /dev/vcsa11) or "grid" (the grid file,
# each cell in its own RGB). "tty" is today's stream.
# source = "tty"

# Grid file, an absolute path of at most 255 bytes. Opened only when
# source is "grid". The default is the path llama-view uses. A value that
# is set is checked in tty mode too, and still not opened there.
# grid = "/run/llama-watch-grid/grid"

# Console font: "12x24" (default), "12x22", "10x18" or "9x18". In tty mode
# this must match `[tty] font` in watch.toml, or the picture is garbled.
# "9x18" is a cast font; tty11 is not switched to it. In grid mode, omit
# this key and the cast picks the largest shipped font whose cells fit in
# 1920x1080, or the smallest (cropped from the top-left) when none fits.
# A 213x60 grid at 9x18 is 1917x1080.
font = "12x24"

# tty11's colours: "llama" (default) or "vga". Match `[tty] palette` in
# watch.toml, so the TV shows the colours tty11 shows. Ignored when source
# is "grid": the file carries each cell's RGB.
palette = "llama"
