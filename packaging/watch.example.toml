[collector]
tick_s = 0.1                        # 0.05..=1.0
cpu_window_s = 1.0                  # tick_s..=5.0
cpu_top_k = 8                       # 1..=nproc

[llama]
# Set enabled = false on a host without llama-swap. The watcher then never
# dials the URL; the LCD shows "no model" and the tty shows NO LLAMA.
enabled = true
# llama-swap's own listen address (its default is :8080). The host must be a
# loopback IP literal. If a reverse proxy already owns 8080, move llama-swap to
# another port and point this at llama-swap directly: a proxy in front of it
# may block /slots and /api/metrics.
url = "http://127.0.0.1:8080"
running_interval_s = 0.5            # 0.1..=60; must exceed its timeout
running_timeout_s = 0.25
metrics_interval_s = 0.25           # 0.1..=60
metrics_timeout_s = 0.2
slots_interval_s = 1.0              # 0.5..=10.0 (never faster than 2 Hz)
slots_timeout_s = 0.5
slots_max_bytes = 4194304           # ≤ 16 MiB
activity_interval_s = 2.0           # 0.1..=60
activity_timeout_s = 0.25
input_tail_chars = 8192             # 256..=32768
output_tail_chars = 24576           # 256..=32768
# Each model's server is read from its llama-swap cmd: llama-server (any path
# or fork) is "llamacpp"; sglang.launch_server / sglang serve is "sglang";
# vllm serve / vllm.entrypoints is "vllm"; serve/server.py --engine strata (or
# a strata* image running python serve/server.py) is "strata"; tqserve (or
# --entrypoint tqserve, or a tqllm* image) is "tqllm"; anything else is
# "openai" (TabbyAPI, ExLlamaV3 or another OpenAI-compatible server). Only
# llama.cpp has /slots (SLOTS, IN/OUT text). SGLang (start it with
# --enable-metrics) and vLLM give tok/s, running/queued requests and KV fill
# from /metrics; Strata gives tok/s, running/queued and ctx from its JSON
# /metrics (not with --api-key: llama-bored keeps no keys). vLLM also gives
# speculative-decoding acceptance, preemptions, sleep, TTFT/ITL/request
# latency and its KV dtype, block size and prefix caching. A command that
# names no server (a container whose image runs vllm serve, a wrapper script)
# gets one /metrics read per load once llama-swap lists it as ready; its
# metric prefix (vllm:, sglang:, llamacpp:) picks the server, else it stays
# "openai". Without /metrics, and for "openai", tokens are counted from
# llama-swap's activity log at the end of each request. Override a wrong guess
# by llama-swap model id (at most 32 entries; ids that are not loaded are
# fine; "openai" here also skips the /metrics read):
#[llama.backends]
#"my-sglang-model" = "sglang"

[models]
max_name_chars = 12
[models.aliases]
# llama-swap model id = short display name (at most 32 entries). Example:
# "my-model-id" = "My Model 7B"

# snapshot dir/file are compile-time constants in llama-core (not configurable)

[load]
# Activity is the busier device: max(gpu, cpu), each
# (watts - idle) / (nominal_frac * limit - idle), clamped to 0..=125 %.
# 100 % is sustained heavy load; spikes read above it on the LCD redline.
# The GPU limit is NVML's enforced limit; the CPU uses AMD socket energy (the
# zenergy hwmon driver). A device with no watts drops out; with neither, activity
# is max(GPU util, CPU mean). The tty ACTIVITY bar shows gpu, cpu or util.
cpu_limit_w = 230                   # finite and > 0; your CPU's full-load socket watts
# idle = "auto" learns each floor: the lowest 10 s mean draw since start,
# ignoring the first 30 s after start or after a source reappears. The watts
# below hold until the first mean; the learned floor may sit above them (a Zen
# package idles near 40 W). It never rises, so load is not learned as idle,
# and it stays under (nominal_frac - 0.1) * limit. A box that is busy from
# boot learns a wrong floor: set idle = "fixed" and the watts below instead.
idle = "auto"                       # "auto" or "fixed" (use the watts below as they are)
gpu_idle_w = 30                     # finite and >= 0
cpu_idle_w = 25                     # finite, >= 0 and < nominal_frac * cpu_limit_w
smooth_s = 0.3                      # 0..=5; 0 disables the EMA
nominal_frac = 0.8                  # 0.5..=1.0; share of each limit that reads 100 %

[tty]
fps = 10                            # 1..=20
full_redraw_s = 5                   # >= 1
# Tok/s at the top of the tty rate scales (tick labels, chart band, RECENT
# speed bars, ACTIVITY gen digits). log-scaled; pick the fastest model's
# decode and prefill rates.
gen_ceiling_tps = 250               # decode; finite, (0, 100000]
prompt_ceiling_tps = 1500           # prefill; finite, (0, 100000]
disk_ceiling_bps = 7000000000      # three-decade disk bars; 7 GB/s, so 12 MB/s still shows
#net_ceiling_bps = 312500000       # NET bar; unset sums the up links' speeds (1 Gbit when unknown)
chart_bucket_s = 2                  # 1..=60; one tty chart column (tokens decoded in that span)
ctx_history_h = 6                   # 1..=24; hours of per-slot context in the SLOTS sparklines
chart_glyphs = "eighths"            # "eighths" needs a llama-hack font on tty11; "halves" renders with eurlatgr (code default)
bar_segments = false                # true: a 1 px gap between gauge bar cells (U+E584, #165); false: solid bars (default)
# Console font and size, applied to tty11 before the watcher starts by the
# unit's root pre-step (`llama-watch tty-setup`, which reads only these two
# keys and runs setfont, then stty). Every display on a GPU shows the same
# console, sized at boot for the largest; on a smaller screen tty11 shows
# only its top-left corner. Size tty11 to the smallest screen:
#   font  "12x24" (default), "12x22" or "10x18": same glyphs, smaller cells.
#         12x22 suits a 1080p screen at desk distance (160x49); 10x18 a
#         1080p screen viewed up close (192x60, room for FANS and TEMPS).
#   size  "COLSxROWS", 160x26..=1024x512; unset keeps the kernel's size.
#         Pixels / cell: 1920x1080 is 160x45 in 12x24, 160x49 in 12x22,
#         192x60 in 10x18.
# Under 48 rows the dashboard drops panels to fit: IN/OUT first, then FANS,
# then the chart shrinks. 160x26 is the floor ("tty too small" below it).
# Takes effect on the next start: systemctl restart llama-watch.
font = "12x24"
#size = "160x49"
# false hides the IN/OUT prompt and output panels (their rows go to the chart
# and RECENT) and the watcher stops keeping llama text at all. The header
# then shows "text off". `llama-watch run --config PATH --no-text` forces
# false whatever this says.
show_text = true
# "clean" strips chat-template control tokens (<|im_start|>, [INST], <think>,
# ...) from the IN panel and marks each turn with a "-- user --" style label.
# "raw" shows the prompt tail as llama-server holds it. Both are sanitised.
prompt_view = "clean"
# Burn-in guard (off by default; 0 = off, 0..=60 minutes). The kernel counts
# both from the last KEYPRESS on the console, not from screen output, so the
# monitor blanks while the dashboard is still updating; any key or a VT switch
# wakes it. blank_min blanks the console (on KMS/DRM that is DPMS standby).
# sleep_min adds a deeper VESA powerdown and must be above blank_min. The
# kernel counts powerdown from the blank, so the watcher sends
# sleep_min - blank_min. The powerdown also needs the console powersave mode,
# which llama-watch.service sets with a root setterm pre-step.
#blank_min = 10
#sleep_min = 15
# tty11's 16 colours. "llama" (default) loads llama-bored's heat palette
# (deep blue -> violet -> magenta -> red, blackbody gold for warnings, greys
# for text) into tty11 with ESC ] P at start and on every full redraw, and
# puts the kernel's colours back (ESC ] R) when the watcher stops. "vga"
# keeps the kernel's VGA colours. Set the same value as `palette` in
# cast.toml.
palette = "llama"

# Read-only fan panel on tty11 (off by default). The watcher reads
# fanN_input, fanN_label, pwmN and pwmN_enable and never writes them.
# Enabled alone, every fan on every hwmon chip shows (the AIO's pump and fan
# too), except a header that has never turned this run. allow / block /
# rename work as in [temps] below, with sensors named "chip:fanN" or by
# their label ("z53:Pump speed"); renames are <= 10 characters.
#[fans]
#enabled = true
#block = ["nct6798:fan7"]
#rename = { "nct6798:fan2" = "rad top", "z53:fan1" = "pump" }
#defaults = true    # false also shows headers that never turned
# The older form still works: one hwmon by `name` (never hwmonN, which
# changes across reboots) and its channels 1..=16, at most 8, with optional
# labels. It is shorthand for allow = ["nct6798:fan2", ...], those fans show
# even at 0 rpm, and it cannot be combined with allow.
#hwmon = "nct6798"
#channels = [2, 3, 5, 6]
#labels = ["front1", "front2", "rear", "top"]

# TEMPS panel and llamabored_temperature_celsius (#74; on by default): every
# /sys/class/hwmon/*/tempN_input, read only, plus the GPU. List the chips
# with: cat /sys/class/hwmon/*/name (two of one name, such as two NVMe
# drives, get a device suffix: nvme-317k). Patterns are globs ("*", "?")
# over "chip" or "chip:sensor", the sensor by its label or tempN.
#   allow    empty: everything; else only the matches, which also pass
#            the built-in rules below
#   block    always hidden; beats allow
#   defaults built-in rules: hide the Super-I/O PCH_*, TSI*, SMBUSMASTER*
#            and PECI* inputs (nct*, w83*), and an input unchanged for ten
#            minutes while its chip's others move; and on the tty only,
#            an NVMe drive's Sensor 1 and 2 and nct6798:AUXTIN2 (the
#            snapshot and metrics keep those)
# Below 5 C or at 127 C and above is never shown, allowed or not.
# rename "chip:sensor" (an item) or "chip" (a row), <= 12 characters;
# warn / crit in C by pattern override the chip's own max / crit, else the
# kind's defaults: coolant 45 / 50, CPU 80 / 90, GPU 88 / 92, NVMe 82 / 85,
# board and memory 60 / 75, Wi-Fi 70 / 85, disks 50 / 60, the rest 70 / 90.
# A block here hides a sensor from the snapshot and metrics too.
[temps]
enabled = true
#allow = []
#block = []
#defaults = true
#rename = { "nct6798:SYSTIN" = "board" }
#warn = { "z53" = 42 }
#crit = { "z53" = 50 }

# tty11's SETUP block (#52): the settings of the model generating now (or
# the one used last) under the meters. Rules pick each value from the
# llama-swap launch command (a flag, a `-e NAME=V` env, or a key of a JSON
# flag), from what the engine reports (`live:`, and `engine:` for the
# settings Strata reports, #54), or from a per-model entry spec (`spec:`,
# a JSON file under `specs_dir`, #92). Numbers and short tokens are shown,
# never a path or a raw argument. A `spec:` rule of kind `text` may also
# show a short label from the file (#114). Built-in rules cover upstream
# llama.cpp, vLLM and SGLang flags and Strata's report
# (crates/llama-watch/src/setup_defaults.toml); rules here are added to
# them, and `defaults = false` keeps only the rules here. README "SETUP
# rules" lists every key.
#[setup]
#defaults = true
#
# Example: a vLLM container configured by env vars rather than flags (the
# HyperQwen image). `match` limits the rules to commands naming it; the
# engine is told from its /metrics, so `engines = ["vllm"]` still applies.
# Copy the block below, without the leading "#", into watch.toml.
# Publish each laid-out tty11 frame as a file for llama-view --source grid
# (#107): the original characters (full Unicode, one cell each) and exact
# RGB, for a userspace console such as kmscon. Off by default; with it off
# nothing is written. The file holds the same prompt and response text tty11
# shows, readable by group llama-view only. The directory below is created by
# /etc/tmpfiles.d/llama-bored.conf (2750 llama-watch:llama-view); a path
# outside it has to exist and be writable by the llama-watch account.
# size (#115) is "COLSxROWS", the same limits as [tty] size (160x26 through
# 1024x512). Unset, or equal to the console's actual size, the file is that
# frame when exact_colors is false. A different size, or exact colours left
# on, is a second layout of the same data on the grid thread; the console
# keeps its size and its palette colours. The cost grows with the IN and OUT
# text. On one machine, a release build measured the model clone, that
# 213x60 layout beside a 192x60 console, and the grid compare (CPU time,
# the median of three runs). The layout was 36.7 µs per frame with no
# IN/OUT text (0.0367% of one core at 10 frames a second) and 640.2 µs
# with IN and OUT at their 32768-character maximums (0.6402%). An
# 8192-character IN was 68.6 µs (0.0686%). The clone was 1.4 µs and the
# compare 9.6 µs on the light frame, and 2.7 µs and 11.0 µs on the full
# frame.
# exact_colors (#116) defaults to true when the file is enabled. Spectrum
# bars, the big digits, the rate charts and temperature readings that have
# warn and crit thresholds then carry a ramp; false writes each cell's
# palette colour. The plane is eight bytes a cell (92160 at 192x60) and is
# not stored per cell when the file is off or this is false. The console
# layout still runs: a painted cell checks for the plane and returns at
# once when it is absent. On that machine, in a later run of that report
# than the figures above, the 192x60 exact layout was 55.9 µs per frame
# with no IN/OUT text (0.0559% of one core at 10 frames a second),
# 156.9 µs with an 8192-character IN (0.1569%), and 618.0 µs with IN and
# OUT at 32768 characters each (0.6180%). The console layout of that frame
# in the same run was 44.6 µs, 71.1 µs and 525.2 µs. The same console
# layout on the commit before this change was 41.1 µs, 80.2 µs and
# 538.5 µs. Two reports of the same build taken at different times differ
# by about a tenth on that machine, so the console layout costs the same
# within that noise. In 256 and 16 colours an RGB equal to a palette slot
# matches the console path. A ramped cell is not a slot, so those
# viewers show the nearest colour; exact_colors = false gives them the
# console's colours. llama-view --colors truecolor, one full first render
# of one busy 192x60 frame (activity past 100, generation past its
# ceiling), wrote 28103 bytes and 13 colour pairs from the palette and
# 35912 bytes and 189 colour pairs with the ramps. That is the first
# render, not the steady-state diff. Each distinct colour pair is its own
# SGR sequence. Both byte counts include the background llama-view sends
# with a full block in truecolor and 256 colours (#120).
#[grid]
#enabled = true
#path = "/run/llama-watch-grid/grid"
#size = "213x60"
#exact_colors = true

