# Example: per-model entry specs (#92). `specs_dir` is an absolute directory
# of `<model-id>.json` files. The watcher does not open it while loading
# this file, and it does not follow a symlink. `defaults = false` keeps only
# these rules. `report.label` is kind `text` (#114): a sentence from the
# file, kept up to `max_chars` (default 64, at most 96) and then to the
# row. It has its own row, `label`, drawn first. Engine, quant and
# parameters stay on `engine`. At 160 columns the label fills its row.
# Copy the block below, without the leading "#", into watch.toml.
# >>> spec example
#specs_dir = "/etc/llama-bored/specs"
#defaults = false
#
#[[setup.field]]
#row = "label"
#source = "spec:report.label"
#kind = "text"
#order = 10
#
#[[setup.field]]
#row = "engine"
#source = "spec:engine"
#kind = "token"
#order = 11
#
#[[setup.field]]
#row = "engine"
#source = "spec:engine_version"
#kind = "token"
#sep = " "
#order = 12
#
#[[setup.field]]
#row = "engine"
#source = "spec:model.quant"
#kind = "token"
#order = 13
#
#[[setup.field]]
#row = "engine"
#source = "spec:model.params_total_b"
#kind = "number"
#label = "params"
#suffix = "B"
#order = 14
#
#[[setup.field]]
#row = "engine"
#source = "spec:model.params_active_b"
#kind = "number"
#sep = " / "
#suffix = "B"
#order = 15
#
#[[setup.field]]
#row = "engine"
#source = "spec:model.arch"
#kind = "token"
#order = 16
#
#[[setup.field]]
#row = "ctx"
#source = "spec:served_context"
#kind = "number"
#order = 20
#
#[[setup.field]]
#row = "ctx"
